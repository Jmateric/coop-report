<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Diagram showing Pacwill Environmental as the link between American manufacturers such as Tisch Environmental and Teledyne, and Canadian customers including government, factories, and industry." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>How Pacwill fits into the air monitoring supply chain</title>

  <style>
    .box    { fill: #ffffff; stroke: #bcd4e6; stroke-width: 1.5; }
    .mid    { fill: #eef5fa; stroke: #4a90c2; stroke-width: 2; }
    .head   { font: bold 15px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #2b5c80; }
    .midhead{ font: bold 17px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1f4a69; }
    .item   { font: 13px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #444444; }
    .flow   { font: italic 12px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #777777; }
    .arrow  { stroke: #4a90c2; stroke-width: 2.5; fill: none; }
  </style>

  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90c2"/>
    </marker>
  </defs>

  <!-- Left: manufacturers -->
  <rect class="box" x="10" y="70" width="190" height="120" rx="4"/>
  <text class="head" x="105" y="98" text-anchor="middle">American manufacturers</text>
  <text class="item" x="105" y="126" text-anchor="middle">Tisch Environmental</text>
  <text class="item" x="105" y="148" text-anchor="middle">Teledyne</text>
  <text class="item" x="105" y="172" text-anchor="middle">Air sampling equipment</text>

  <!-- Middle: Pacwill -->
  <rect class="mid" x="265" y="50" width="190" height="160" rx="4"/>
  <text class="midhead" x="360" y="82" text-anchor="middle">Pacwill Environmental</text>
  <text class="item" x="360" y="104" text-anchor="middle">Stoney Creek, Ontario</text>
  <text class="item" x="360" y="134" text-anchor="middle">Distribution and marketing</text>
  <text class="item" x="360" y="156" text-anchor="middle">Installation and service</text>
  <text class="item" x="360" y="178" text-anchor="middle">English and French support</text>

  <!-- Right: customers -->
  <rect class="box" x="520" y="70" width="190" height="120" rx="4"/>
  <text class="head" x="615" y="98" text-anchor="middle">Canadian customers</text>
  <text class="item" x="615" y="126" text-anchor="middle">Government of Canada</text>
  <text class="item" x="615" y="148" text-anchor="middle">Factories</text>
  <text class="item" x="615" y="172" text-anchor="middle">Industrial organizations</text>

  <!-- Arrows -->
  <line class="arrow" x1="205" y1="130" x2="258" y2="130" marker-end="url(#tip)"/>
  <line class="arrow" x1="462" y1="130" x2="514" y2="130" marker-end="url(#tip)"/>

  <text class="flow" x="231" y="118" text-anchor="middle">equipment</text>
  <text class="flow" x="488" y="118" text-anchor="middle">equipment</text>

  <!-- Return flow -->
  <path class="arrow" d="M 615 200 L 615 245 L 360 245" marker-end="url(#tip)"/>
  <text class="flow" x="490" y="262" text-anchor="middle">orders, service requests, support</text>

  <!-- Portal note -->
  <path class="arrow" d="M 360 245 L 360 218" marker-end="url(#tip)"/>
  <text class="item" x="360" y="30" text-anchor="middle">All of it tracked in a custom internal portal</text>
  <line x1="360" y1="38" x2="360" y2="46" stroke="#bcd4e6" stroke-width="1.5"/>
</svg>
